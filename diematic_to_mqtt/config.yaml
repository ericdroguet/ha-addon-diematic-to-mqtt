name: "Diematic to MQTT - Eric"
version: "1.1.2"
slug: "diematic_to_mqtt_eric"
description: "Passerelle ModBus vers MQTT pour chaudière De Dietrich Diematic 3/4 (basé sur Benoit3/Diematic_to_MQTT)"
url: "https://github.com/ericdroguet/ha-addon-diematic-to-mqtt"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
options:
  modbus_ip: "192.168.1.X"
  modbus_port: 20108
  regulator_address: "0x0A"
  interface_address: "0x32"
  mqtt_broker_host: "core-mosquitto"
  mqtt_broker_port: 1883
  mqtt_broker_login: ""
  mqtt_broker_password: ""
  topic_prefix: "home/heater"
  client_id: "boiler"
  regulator_type: "Diematic3"
  timezone: "CET"
  time_sync: false
  period: 10
  enable_circuit_a: false
  enable_circuit_b: false
  enable_circuit_c: false
  mqtt_discovery_enable: true
  discovery_prefix: "homeassistant"
schema:
  modbus_ip: str
  modbus_port: port
  regulator_address: str
  interface_address: str
  mqtt_broker_host: str
  mqtt_broker_port: port
  mqtt_broker_login: str
  mqtt_broker_password: password
  topic_prefix: str
  client_id: str
  regulator_type: "list(Diematic3|Diematic4|DiematicDelta)"
  timezone: str
  time_sync: bool
  period: "int(1,300)"
  enable_circuit_a: bool
  enable_circuit_b: bool
  enable_circuit_c: bool
  mqtt_discovery_enable: bool
  discovery_prefix: str
