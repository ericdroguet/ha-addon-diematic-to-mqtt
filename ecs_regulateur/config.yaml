name: "Régulation intelligente - ECS"
version: "0.1.3"
slug: "ecs_regulateur"
description: "Pilotage hybride ECS fioul/électricité et Tempo"
url: "https://github.com/ericdroguet/ha-addon-diematic-to-mqtt"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
homeassistant_api: true
options:
  fuel_target: 50
  electric_target: 55
  electric_max_minutes: 120
  rearm_below: 48
  poll_seconds: 15
schema:
  fuel_target: "int(50,50)"
  electric_target: "int(55,60)"
  electric_max_minutes: "int(1,120)"
  rearm_below: "int(40,49)"
  poll_seconds: "int(10,60)"
