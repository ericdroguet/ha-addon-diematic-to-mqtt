name: "IA Maison - Meylan"
version: "0.1.3"
slug: ia_maison
description: "Observation locale et apprentissage thermique sans commande"
url: "https://github.com/ericdroguet/ha-addon-diematic-to-mqtt"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:brain
panel_title: IA Maison
options:
  poll_seconds: 60
  retention_days: 365
  max_storage_gib: 5
schema:
  poll_seconds: "int(60,300)"
  retention_days: "int(30,365)"
  max_storage_gib: "int(1,8)"
