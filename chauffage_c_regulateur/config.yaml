name: "Régulation intelligente - Circuit C"
version: "0.1.4"
slug: "chauffage_c_regulateur"
description: "Régulation indépendante du circuit C à partir des thermostats Danfoss et Eve"
url: "https://github.com/ericdroguet/ha-addon-diematic-to-mqtt"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
homeassistant_api: true
hassio_api: true
options:
  automatic_control: false
  dry_run: true
  manual_day: 21.0
  manual_night: 19.0
  minimum_virtual: 18.5
  maximum_virtual: 23.0
  poll_seconds: 30
  write_interval_seconds: 120
  max_rise_per_write: 1.0
  max_drop_per_write: 0.5
  weather_anticipation: false
  weather_max_boost: 1.0
schema:
  automatic_control: bool
  dry_run: bool
  manual_day: "float(6,30)"
  manual_night: "float(6,30)"
  minimum_virtual: "float(6,30)"
  maximum_virtual: "float(6,30)"
  poll_seconds: "int(15,300)"
  write_interval_seconds: "int(60,1800)"
  max_rise_per_write: "float(0.5,3)"
  max_drop_per_write: "float(0.5,3)"
  weather_anticipation: bool
  weather_max_boost: "float(0,1)"
